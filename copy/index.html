<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Copy caption · Explained, Badly</title>
<link rel="stylesheet" href="/explained-badly/style.css">
<style>
#caption{display:block;width:100%;min-height:10em;padding:14px;margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;resize:vertical}
.actions{display:flex;flex-direction:column;gap:12px}
#copy{padding:18px;border:0;border-radius:10px;background:var(--accent);color:var(--bg);font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer}
.actions a{display:block;padding:14px;border:1px solid var(--accent);border-radius:10px;text-align:center;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/explained-badly/">Explained, Badly</a></header>
<main>
<h1>Copy caption</h1>
<div id="has">
<textarea id="caption" readonly aria-label="Caption"></textarea>
<div class="actions">
<button id="copy" type="button">Copy caption</button>
<a href="snssdk1233://">Open TikTok</a>
</div>
</div>
<p id="none" class="muted" hidden>There is no caption to copy.</p>
</main>
<footer><a href="/explained-badly/privacy/">Privacy Policy</a><a href="/explained-badly/terms/">Terms of Service</a><a href="mailto:sanket@eromteknas.com">sanket@eromteknas.com</a></footer>
</div>
<script>
var box = document.getElementById('caption'), btn = document.getElementById('copy');
var caption = '';
try { caption = decodeURIComponent(location.hash.slice(1)); } catch (e) { caption = location.hash.slice(1); }
if (!caption) {
  document.getElementById('has').hidden = true;
  document.getElementById('none').hidden = false;
}
box.value = caption;
function done() { btn.textContent = 'Copied'; }
function fallback() {
  box.focus();
  box.setSelectionRange(0, box.value.length);
  if (document.execCommand('copy')) done(); else btn.textContent = 'Select the text and copy it';
}
btn.addEventListener('click', function () {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(caption).then(done, fallback);
  } else {
    fallback();
  }
});
</script>
</body>
</html>
